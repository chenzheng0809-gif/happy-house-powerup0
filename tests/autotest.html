<!doctype html><html><head><meta charset="utf-8"><title>U4 autotest</title>
<style>html,body{margin:0;background:#222}iframe{width:1440px;height:900px;border:0;display:block}
#out{position:fixed;left:0;bottom:0;max-height:200px;overflow:auto;background:#000;color:#0f0;font:12px monospace;margin:0;white-space:pre-wrap}</style>
</head><body>
<iframe id="app" src="../index.html"></iframe>
<pre id="out">running</pre>
<script src="lib.js"></script>
<script src="suite.js"></script>
<script>
(async function () {
  try {
    const iframe = document.getElementById("app");
    const W = iframe.contentWindow, D = W.document;
    const res = await U4TestSuite.run(W, D);
    res.title = "U4TEST PASS=" + res.pass + " FAIL=" + res.fail;
    document.title = res.title;
    document.getElementById("out").textContent = JSON.stringify(res);
  } catch (e) {
    document.title = "U4TEST ERROR";
    document.getElementById("out").textContent = "ERROR: " + ((e && e.stack) || e);
  }
})();
</script></body></html>
