<!doctype html><html><head><meta charset="utf-8"><title>U4 shot</title>
<style>html,body{margin:0;overflow:hidden;background:#FFF7EC}iframe{width:100vw;height:100vh;border:0;display:block}</style>
</head><body>
<iframe id="app" src="../index.html"></iframe>
<script src="lib.js"></script>
<script>
(async function () {
  const iframe = document.getElementById("app");
  const W = iframe.contentWindow;
  await U4TestLib.waitReady(W);
  const params = new URLSearchParams(location.search);
  const screen = params.get("screen") || "map";
  const room = params.get("room") || "bedroom";
  const seed = params.get("seed");
  if (seed === "1") {
    const st = { stars: 9, levels: { "1": { stars: 3, best: 4, correct: 4, total: 4, skill: "家具词汇" }, "2": { stars: 2, best: 3, correct: 3, total: 5, skill: "数量与文具" } }, skills: { "家具词汇": { correct: 4, total: 4 }, "数量与文具": { correct: 3, total: 5 } }, decor: [{ id: "d1", e: "🛏️", x: 24, y: 68 }, { id: "d2", e: "💡", x: 72, y: 38 }, { id: "d5", e: "🧸", x: 60, y: 78 }], sound: false, music: false };
    try { W.localStorage.setItem("happy_house_u4_v1", JSON.stringify(st)); } catch (e) {}
    iframe.src = "../index.html?r=" + Math.random();
    await new Promise(r => { iframe.onload = r; });
    await U4TestLib.waitReady(W);
  }
  const W2 = iframe.contentWindow;
  W2.document.querySelector("#btn-splash-start").click();
  await U4TestLib.sleep(600);
  const mode = params.get("mode") || "screen";
  if (mode === "room") W2.U4.router.show("room", room);
  else if (mode === "level") W2.U4.startLevel(W2.U4.DATA.levels[(+params.get("id") || 1) - 1]);
  else if (mode === "story") {
    W2.U4.Stories.open("wishes", null);
    await U4TestLib.sleep(1000);
    const nb = W2.document.querySelector('[data-act="storyNext"]');
    if (nb) nb.click();
    await U4TestLib.sleep(700);
    const nb2 = W2.document.querySelector('[data-act="storyNext"]');
    if (nb2) nb2.click();
  } else W2.U4.router.show(screen);
  await new Promise(() => {});
})();
</script></body></html>
